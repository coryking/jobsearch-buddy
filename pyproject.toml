[project]
name = "jobsearch-buddy"
version = "0.1.0"
description = "Job search tool with ATS scraping, SQLite cache, vector search, and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "flask>=3.0.0",
    "httpx>=0.28.1",
    "numpy>=1.24.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.2.0",
    "rich>=14.3.2",
    "sqlite-vec>=0.1.6",
    "openai>=1.0.0",
    "toml>=0.10.0",
    "typer>=0.23.1",
    "questionary>=2.1.0",
    "humanize>=4.15.0",
]

[project.scripts]
ats = "jobbuddy.cli:app"
ats-mcp = "jobbuddy.mcp_server:main"
ats-eval = "jobbuddy.eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "icdiff>=2.0.10",
    "pytest>=9.0.2",
]
