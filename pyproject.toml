[project]
name = "jobsearch-buddy"
version = "0.1.0"
description = "Job search tool with ATS scraping, PostgreSQL FTS cache, and cloud-hosted MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.1",
    "httpx>=0.28.1",
    "platformdirs>=4.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.2.0",
    "rich>=14.3.2",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "openai>=1.0.0",
    "toml>=0.10.0",
    "typer>=0.23.1",
    "questionary>=2.1.0",
    "humanize>=4.15.0",
    "azure-identity>=1.19.0",
    "redis>=5.0.0",
    "azure-monitor-opentelemetry>=1.6.0",
]

[project.scripts]
jsb = "jobbuddy.cli:app"
jsb-mcp = "jobbuddy.mcp_server:main"
jsb-eval = "jobbuddy.eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
include = ["src/jobbuddy"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
    "icdiff>=2.0.10",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "tiktoken>=0.12.0",
]
