---
# Deploy and activate systemd user units for jobsearch-buddy.
#
# Prerequisites NOT managed here (provision manually):
#   - Env file: ~/.config/jsb-mcp.env  (secrets — keep in 1Password)
#   - Project venv: cd ~/projects/jobsearch-buddy && uv sync
#   - Linger enabled for the target user (so units survive without a login session)
#
# jsb-sync.service is static (timer-triggered); it is deployed but NOT enabled
# or started directly — the timer drives it.

- name: Create user systemd directory
  ansible.builtin.file:
    path: "{{ jsb_services_systemd_user_dir }}"
    state: directory
    owner: "{{ jsb_services_user }}"
    group: "{{ jsb_services_user }}"
    mode: "0755"

- name: Deploy jsb user systemd unit files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ jsb_services_systemd_user_dir }}/{{ item }}"
    owner: "{{ jsb_services_user }}"
    group: "{{ jsb_services_user }}"
    mode: "0644"
  loop:
    - jsb-mcp.service
    - jsb-sync.service
    - jsb-sync.timer
  notify: Reload jsb_services user systemd daemon

- name: Flush handlers so daemon-reload runs before enable/start
  ansible.builtin.meta: flush_handlers

# Always-on MCP daemon. failed_when: false because env file / venv may not exist
# on a fresh provision — unit files are in place; re-run after prereqs to activate.
- name: Enable and start jsb-mcp.service
  ansible.builtin.systemd:
    name: jsb-mcp.service
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ jsb_services_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ jsb_services_user_uid }}"
  failed_when: false

# Timer is enabled (so it loads on next boot / linger start); timers
# self-activate once enabled — no state: started needed.
- name: Enable jsb-sync.timer
  ansible.builtin.systemd:
    name: jsb-sync.timer
    enabled: true
    scope: user
  become: true
  become_user: "{{ jsb_services_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ jsb_services_user_uid }}"
  failed_when: false

- name: Note prerequisites required before services will start
  ansible.builtin.debug:
    msg: >-
      jsb_services: ensure ~/.config/jsb-mcp.env exists and
      'cd ~/projects/jobsearch-buddy && uv sync' has been run.
      Re-run deploy.yml after provisioning prereqs to fully activate units.
